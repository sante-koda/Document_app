
{% extends "documents/base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">

        <h1 class="text-2xl font-bold text-gray-900 mb-2">
            {{ terms.title }}
        </h1>

        <p class="text-sm text-gray-500 mb-6">
            Version {{ terms.version }}
        </p>

        <div class="prose max-w-none text-gray-700 mb-8">
            {{ terms.content|linebreaks }}
        </div>

        <form method="POST">
            {% csrf_token %}

            <input
                type="hidden"
                name="next"
                value="{{ next }}"
            >

            <div class="flex items-start mb-6">
                <input
                    id="accept_terms"
                    name="accept_terms"
                    type="checkbox"
                    value="yes"
                    required
                    class="w-4 h-4 mt-1 text-blue-600
                           bg-gray-100 border-gray-300
                           rounded focus:ring-blue-500"
                >

                <label
                    for="accept_terms"
                    class="ms-2 text-sm text-gray-700"
                >
                    I have read, understood and agree to
                    the Terms and Conditions above.
                </label>
            </div>

            <div class="flex gap-3">
                <button
                    type="submit"
                    class="text-white bg-blue-700 hover:bg-blue-800
                           focus:ring-4 focus:ring-blue-300
                           font-medium rounded-lg text-sm
                           px-5 py-2.5"
                >
                    Accept and Proceed
                </button>

                <a
                    href="{% url 'documents:document_list' %}"
                    class="text-gray-900 bg-white border
                           border-gray-300 hover:bg-gray-100
                           font-medium rounded-lg text-sm
                           px-5 py-2.5"
                >
                    Decline
                </a>
            </div>
        </form>

    </div>
</div>
{% endblock %}
